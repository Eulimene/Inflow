language = "C"
include_guard = "INFLOW_CORE_GENERATED_H"
autogen_warning = "/* Generated by cargo xtask bindings. Do not edit manually. */"
cpp_compat = true
documentation = true
documentation_style = "doxy"
documentation_length = "full"
line_length = 100
tab_width = 4
usize_is_size_t = false
sort_by = "None"

trailer = """
#ifndef INFLOW_CORE_ABI_LAYOUT_ASSERTIONS
#define INFLOW_CORE_ABI_LAYOUT_ASSERTIONS
#if UINTPTR_MAX == UINT64_MAX
#if defined(__cplusplus)
static_assert(sizeof(InflowEngineCreateResult) == 32, "InflowEngineCreateResult ABI layout changed");
static_assert(sizeof(InflowBytesResult) == 24, "InflowBytesResult ABI layout changed");
#else
_Static_assert(sizeof(InflowEngineCreateResult) == 32, "InflowEngineCreateResult ABI layout changed");
_Static_assert(sizeof(InflowBytesResult) == 24, "InflowBytesResult ABI layout changed");
#endif
#endif
#endif /* INFLOW_CORE_ABI_LAYOUT_ASSERTIONS */
"""

[parse]
parse_deps = false

[export]
include = ["InflowStatus"]
exclude = ["ABI_MAJOR", "ABI_MINOR", "ABI_CAPABILITIES", "ENGINE_SCHEMA_VERSION", "MAX_HTML_BYTES"]
item_types = ["constants", "typedefs", "opaque", "structs", "functions"]
renaming_overrides_prefixing = true

[export.rename]
"CAPABILITY_EDITOR_ENGINE" = "INFLOW_CAPABILITY_EDITOR_ENGINE"
"CAPABILITY_UNIFIED_DERIVATION" = "INFLOW_CAPABILITY_UNIFIED_DERIVATION"
"CAPABILITY_ENGINE_HISTORY" = "INFLOW_CAPABILITY_ENGINE_HISTORY"
"CAPABILITY_RENDER_IR" = "INFLOW_CAPABILITY_RENDER_IR"
"CAPABILITY_NATIVE_RENDER_PLAN" = "INFLOW_CAPABILITY_NATIVE_RENDER_PLAN"
"CAPABILITY_ENGINE_SEARCH" = "INFLOW_CAPABILITY_ENGINE_SEARCH"
"CAPABILITY_FORMAT_INSPECTION" = "INFLOW_CAPABILITY_FORMAT_INSPECTION"
"CAPABILITY_ENGINE_PERSISTENCE" = "INFLOW_CAPABILITY_ENGINE_PERSISTENCE"
"CAPABILITY_ENGINE_MODE" = "INFLOW_CAPABILITY_ENGINE_MODE"
"CAPABILITY_HOST_EFFECTS" = "INFLOW_CAPABILITY_HOST_EFFECTS"
"CAPABILITY_DOCUMENT_CODEC" = "INFLOW_CAPABILITY_DOCUMENT_CODEC"
"STATUS_OK" = "INFLOW_STATUS_OK"
"STATUS_INVALID_ARGUMENT" = "INFLOW_STATUS_INVALID_ARGUMENT"
"STATUS_INVALID_UTF8" = "INFLOW_STATUS_INVALID_UTF8"
"STATUS_MIXED_LINE_ENDINGS" = "INFLOW_STATUS_MIXED_LINE_ENDINGS"
"STATUS_OUTPUT_TOO_LARGE" = "INFLOW_STATUS_OUTPUT_TOO_LARGE"
"STATUS_AMBIGUOUS_FORMAT" = "INFLOW_STATUS_AMBIGUOUS_FORMAT"
"STATUS_REVISION_CONFLICT" = "INFLOW_STATUS_REVISION_CONFLICT"
"STATUS_PANIC" = "INFLOW_STATUS_PANIC"

[const]
sort_by = "None"
